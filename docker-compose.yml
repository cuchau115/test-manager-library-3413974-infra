name: manager-library

services:
  db:
    image: postgres:16
    container_name: library-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library

  api:
    build:
      context: ../test-manager-library-3413974-api
      dockerfile: Dockerfile
    container_name: library-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}
      DB_CONNECTION: pgsql
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COVERS_DIR: ${COVERS_DIR:-/var/www/html/storage/app/covers}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:80"
    volumes:
      - covers:/var/www/html/storage/app/covers
    healthcheck:
      test: ["CMD-SHELL", "php -r '$$r=@file_get_contents(\"http://127.0.0.1/health\"); exit(is_string($$r) && str_contains($$r, \"\\\"status\\\":\\\"ok\\\"\") ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - library

  app:
    build:
      context: ../test-manager-library-3413974-app
      dockerfile: Dockerfile
    container_name: library-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - library

  page:
    build:
      context: ../test-manager-library-3413974-page
      dockerfile: Dockerfile
    container_name: library-page
    restart: unless-stopped
    ports:
      - "${PAGE_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - library

  tool:
    profiles: ["tool"]
    build:
      context: ../test-manager-library-3413974-tool
      dockerfile: Dockerfile
    container_name: library-tool
    environment:
      API_BASE_URL: http://api/api/v1/
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - library

volumes:
  db-data:
  covers:

networks:
  library:
    driver: bridge
